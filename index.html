<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rail Rivalry — NFL × Bible</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:#f5f7ff;background:#071127;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top left,#14335a 0%,#071127 50%,#080d20 100%)}.shell{max-width:850px;margin:auto;padding:20px 16px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:14px;letter-spacing:.13em;color:#8dc8ff;font-weight:900}.chip{border:1px solid #ffffff35;border-radius:99px;padding:8px 12px;font-size:12px;color:#cedaf2}.hero{padding:54px 0 24px}.eyebrow{color:#6fe4c2;font-size:13px;font-weight:900;letter-spacing:.14em}h1{font-size:clamp(40px,9vw,72px);letter-spacing:-.06em;line-height:1.01;margin:12px 0}h2{font-size:clamp(24px,5vw,40px);letter-spacing:-.035em;margin:12px 0 20px}.sub{color:#b4c4dd;font-size:17px;line-height:1.5}.panel{background:#10213bc9;border:1px solid #b6c8ed25;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 12px 42px #0002}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;border:0;border-radius:13px;padding:12px 19px;background:#71ebc2;color:#09243a;font-weight:900;font-size:16px;cursor:pointer}.btn.secondary{background:#263d60;color:#f3f7ff}.btn.tertiary{background:transparent;border:1px solid #567092;color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.field{display:block;width:100%;padding:16px 14px;background:#07152d;border:1px solid #506788;color:white;border-radius:12px;font-size:18px;margin:12px 0}.muted{color:#9cb2d0}.small{font-size:13px;line-height:1.5}.tag{display:inline-block;color:#7de8c9;font-weight:800;letter-spacing:.12em;font-size:12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.option{min-height:100px;padding:18px;text-align:left;border:1px solid #526588;background:#1d3154;color:#fff;border-radius:17px;font-size:17px;font-weight:750;cursor:pointer;display:flex;align-items:center;gap:14px}.option b{background:#ffffff22;border-radius:11px;padding:10px 14px}.option.selected{outline:3px solid #6ee8bd;background:#19544e}.option.right{border-color:#65e7a2;background:#15533e}.option.wrong{border-color:#fd878c;background:#5c2638}.option:disabled{cursor:default}.statline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.timer{font-size:34px;font-weight:950;font-variant-numeric:tabular-nums;color:#6fe4c2}.progress{height:8px;border-radius:9px;overflow:hidden;background:#314562;margin:15px 0}.progress span{display:block;height:100%;background:#71ebc2;transition:width .4s}.rank{display:flex;align-items:center;gap:12px;padding:13px 11px;border-bottom:1px solid #ffffff20}.rank:last-child{border:0}.place{width:34px;font-size:22px;font-weight:950;color:#7de8c9}.name{flex:1;font-weight:750;overflow:hidden;text-overflow:ellipsis}.score{font-variant-numeric:tabular-nums;font-weight:950}.bar{height:5px;background:#70eac0;margin-top:7px;border-radius:5px}.share{word-break:break-all;background:#07152d;border:1px dashed #7996c0;border-radius:10px;padding:13px;line-height:1.5}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.center{text-align:center}.hide{display:none!important}#qr{display:flex;justify-content:center;background:white;padding:12px;width:max-content;margin:12px auto;border-radius:10px}#qr img{max-width:180px}.notice{background:#2b3c54;padding:12px 14px;border-radius:10px;color:#d2e0f4;font-size:14px}.correctText{padding:12px;background:#123b36;border:1px solid #3fab83;border-radius:10px}.footer{color:#869bb9;font-size:12px;text-align:center;margin-top:24px}.wide{width:100%}@media(max-width:600px){.options,.columns{grid-template-columns:1fr}.hero{padding-top:35px}.option{min-height:73px}.panel{padding:17px}}

#error{color:#ffd3d6;background:#55273a;border-radius:10px;padding:12px;display:none;margin:12px 0}.loading{opacity:.6}.help{font-size:13px;color:#b4c4dd;line-height:1.5}button{touch-action:manipulation}</style></head><body><div class="shell"><header class="top"><div class="logo">🏈 RAIL RIVALRY ✦ BIBLE</div><div class="chip" id="net">SERVER CONNECTED?</div></header><main id="app"></main><div id="error" role="alert"></div><div class="footer">15 questions • 7 players • Server-based live scores</div></div><script>
const Q=[
{c:'NFL',q:'Who won Super Bowl LIX in February 2025?',o:['Kansas City Chiefs','Philadelphia Eagles','Buffalo Bills','San Francisco 49ers'],a:1,f:'The Eagles beat Kansas City 40–22 in Super Bowl LIX.'},
{c:'NFL',q:'Who was named MVP of Super Bowl LIX (2025)?',o:['Saquon Barkley','Patrick Mahomes','Jalen Hurts','A.J. Brown'],a:2,f:'Jalen Hurts won Super Bowl LIX MVP.'},
{c:'NFL',q:'Which team did the Chiefs beat in overtime at Super Bowl LVIII in 2024?',o:['Detroit Lions','Philadelphia Eagles','Baltimore Ravens','San Francisco 49ers'],a:3,f:'Kansas City beat San Francisco 25–22 in overtime.'},
{c:'NFL',q:'Who was the NFL MVP for the 2023 season?',o:['Lamar Jackson','Josh Allen','Brock Purdy','Christian McCaffrey'],a:0,f:'Lamar Jackson won his second league MVP award for the 2023 season.'},
{c:'NFL',q:'Which Houston Texans quarterback won Offensive Rookie of the Year for 2023?',o:['Bryce Young','C.J. Stroud','Anthony Richardson','Will Levis'],a:1,f:'C.J. Stroud received the 2023 AP Offensive Rookie of the Year award.'},
{c:'NFL',q:'Which team selected Caleb Williams first overall in the 2024 NFL Draft?',o:['Washington Commanders','New England Patriots','Chicago Bears','Arizona Cardinals'],a:2,f:'Chicago used the first overall pick on Caleb Williams.'},
{c:'NFL',q:'Who won Super Bowl LVII, played in February 2023?',o:['Kansas City Chiefs','Philadelphia Eagles','Los Angeles Rams','Cincinnati Bengals'],a:0,f:'The Chiefs beat the Eagles 38–35 in Super Bowl LVII.'},
{c:'NFL',q:'Which running back joined the Eagles in 2024 after playing for the New York Giants?',o:['Derrick Henry','Josh Jacobs','Christian McCaffrey','Saquon Barkley'],a:3,f:'Saquon Barkley signed with Philadelphia in 2024.'},
{c:'BIBLE',q:'Which king consulted the Witch (medium) of Endor in 1 Samuel 28?',o:['David','Solomon','Saul','Ahab'],a:2,f:'King Saul visited the medium at Endor and asked her to bring up Samuel.'},
{c:'BIBLE',q:'Who was summoned by the medium at Endor, according to the account in 1 Samuel 28?',o:['Samuel','Elijah','Moses','Jonathan'],a:0,f:'The narrative identifies the figure as Samuel.'},
{c:'BIBLE',q:'Which disciple denied knowing Jesus three times?',o:['Thomas','Peter','John','Andrew'],a:1,f:'Peter denied Jesus three times before the rooster crowed.'},
{c:'BIBLE',q:'Which prophet confronted the prophets of Baal on Mount Carmel?',o:['Elisha','Isaiah','Jeremiah','Elijah'],a:3,f:'Elijah challenged the prophets of Baal in 1 Kings 18.'},
{c:'BIBLE',q:'In which New Testament book do we read about the day of Pentecost?',o:['Romans','Acts','Hebrews','Revelation'],a:1,f:'The Pentecost account is in Acts chapter 2.'},
{c:'BIBLE',q:'Who interpreted Pharaoh’s dreams about seven plentiful years and seven years of famine?',o:['Daniel','Moses','Joseph','Jacob'],a:2,f:'Joseph interpreted Pharaoh’s dreams in Genesis 41.'},
{c:'BIBLE',q:'Which Gospel contains the parable of the Good Samaritan?',o:['Luke','Matthew','Mark','John'],a:0,f:'The Good Samaritan appears in Luke 10.'}
];
const app=document.getElementById('app'),net=document.getElementById('net'),errBox=document.getElementById('error');
const params=new URLSearchParams(location.search),incoming=params.get('room');
let room=incoming||'',token='',uid=localStorage.getItem('rail_uid')||'',role='landing',data=null,selected=null,lastIndex=-1,poll=null,busy=false,misses=0;
if(!uid){uid=(crypto.randomUUID?.()||Math.random().toString(36).slice(2));localStorage.setItem('rail_uid',uid)}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='')=>`<button class="btn ${cls}" onclick="${action}">${label}</button>`;
function error(s){errBox.textContent=s;errBox.style.display='block'}function clearError(){errBox.style.display='none'}
function invite(){return location.origin+location.pathname+'?room='+encodeURIComponent(room)}
async function api(action,payload={},quiet=false){
 const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),10000);
 try{
  const response=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,room,token,uid,...payload}),signal:ctl.signal,cache:'no-store'});
  const result=await response.json().catch(()=>({error:'Server response was not JSON. Check that Netlify Functions deployed correctly.'}));
  if(!response.ok||result.error)throw new Error(result.error||'Server error '+response.status);
  misses=0;net.textContent='● CONNECTED';if(!quiet)clearError();return result;
 }catch(ex){misses++;net.textContent='● CONNECTION ISSUE';if(!quiet)error(ex.message+(ex.name==='AbortError'?' (request timed out)':''));throw ex}
 finally{clearTimeout(timeout)}
}
function landing(){role='landing';stopPolling();app.innerHTML=`<section class="hero"><div class="eyebrow">TRAIN JOURNEY SHOWDOWN</div><h1>Two worlds.<br>One champion.</h1><p class="sub">NFL trivia meets Bible knowledge. Seven players, fifteen questions and one live leaderboard.</p></section><div class="panel"><h2>Start playing</h2><div class="actions">${button('🎮 Host new game','createHost()')}${button('📱 Join game','joinView()','secondary')}</div><p class="help">Unlike the original version, this edition uses Netlify Functions and central game storage, rather than phone-to-phone connections.</p></div>`}
async function createHost(){if(busy)return;busy=true;app.innerHTML='<div class="panel"><h2>Creating room…</h2></div>';try{const r=await api('create');room=r.room;token=r.token;role='host';sessionStorage.setItem('rail_host_'+room,token);history.replaceState(null,'',location.pathname+'?room='+room+'&host=1');data=r;render();startPolling()}catch{landing()}finally{busy=false}}
function joinView(){stopPolling();role='join';app.innerHTML=`<section class="hero"><h1>Join the game.</h1><p class="sub">Each player joins independently from their phone.</p></section><div class="panel"><label>Room code</label><input class="field" id="code" maxlength="6" placeholder="ABC234" value="${esc(room||'')}" autocapitalize="characters"><label>Your name</label><input class="field" id="name" maxlength="18" placeholder="e.g. Touchdown Tom" value="${esc(localStorage.getItem('rail_name')||'')}">${button('Join room →','joinGame()','wide')}</div>`}
async function joinGame(){if(busy)return;room=document.getElementById('code').value.toUpperCase().trim();const name=document.getElementById('name').value.trim();if(!/^[A-HJ-NP-Z2-9]{6}$/.test(room))return error('Please enter the six-character room code.');if(!name)return error('Enter your name.');busy=true;try{const r=await api('join',{name});localStorage.setItem('rail_name',name);sessionStorage.setItem('rail_player_'+room,'1');role='player';history.replaceState(null,'',location.pathname+'?room='+room);data=r;render();startPolling()}catch{}finally{busy=false}}
function stopPolling(){if(poll)clearInterval(poll);poll=null}
function startPolling(){stopPolling();poll=setInterval(async()=>{if(busy||!['host','player'].includes(role))return;try{const r=await api('state',{},true);const changed= !data||r.revision!==data.revision||r.phase!==data.phase;if(changed){data=r;render()}else tick()}catch{if(misses===3)error('The game server is temporarily unavailable. Retrying automatically.')}} ,1300)}
async function sendAction(action,payload={}){if(busy)return;busy=true;try{data=await api(action,payload);render()}catch{}finally{busy=false}}
function answer(a){if(selected!==null||busy||data?.phase!=='question')return;selected=a;render();sendAction('answer',{idx:data.idx,answer:a})}
function scores(){const arr=data.players||[],max=Math.max(1,...arr.map(p=>p.score));return arr.map((p,i)=>`<div class="rank"><div class="place">${i+1}</div><div class="name">${esc(p.name)} ${p.uid===uid&&role==='player'?'(you)':''}<div class="bar" style="width:${Math.max(3,p.score/max*100)}%"></div></div><div class="score">${p.score.toLocaleString()}</div></div>`).join('')||'<p class="muted">Waiting for players…</p>'}
function render(){if(!data)return;if(data.idx!==lastIndex){selected=null;lastIndex=data.idx}if(data.phase==='lobby'){if(role==='host'){app.innerHTML=`<section class="hero"><div class="eyebrow">YOUR LIVE ROOM</div><h1>${esc(room)}</h1><p class="sub">Send the link to your group. Everyone joins from their own phone.</p></section><div class="panel"><div class="tag">INVITE LINK</div><div class="share">${esc(invite())}</div><div class="actions">${button('Copy link','copyLink()','secondary')}${button('Share invite','shareLink()','tertiary')}</div></div><div class="panel"><h2>Players (${data.players.length}/7)</h2>${scores()}${button('Start quiz →',"sendAction('start')",'wide')}</div>`}else{app.innerHTML=`<section class="hero"><div class="eyebrow">YOU ARE IN!</div><h1>You're ready.</h1><p class="sub">Waiting for the host to start.</p></section><div class="panel"><h2>Players (${data.players.length}/7)</h2>${scores()}</div>`}return}
 const q=Q[data.idx]||Q[14],revealed=data.phase==='reveal',done=data.phase==='finished',answered=selected!==null||data.players.find(p=>p.uid===uid)?.answered,me=data.players.find(p=>p.uid===uid);
 app.innerHTML=`<div class="panel"><div class="statline"><span class="tag">${done?'FINAL RESULTS':esc(q.c)+' • '+(data.idx+1)+'/15'}</span><span id="timer" class="timer"></span></div>${done?`<h2>🏆 ${esc(data.players[0]?.name||'Champion')} wins!</h2><p class="sub">Final results for all seven players.</p>`:`<div class="progress"><span style="width:${100*(data.idx+1)/15}%"></span></div><h2>${esc(q.q)}</h2><div class="options">${q.o.map((o,i)=>role==='host'?`<div class="option ${revealed&&i===data.correct?'right':''}"><b>${'ABCD'[i]}</b>${esc(o)}</div>`:`<button class="option ${selected===i?'selected':''} ${revealed&&i===data.correct?'right':''} ${revealed&&selected===i&&i!==data.correct?'wrong':''}" ${answered||revealed?'disabled':''} onclick="answer(${i})"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('')}</div>${revealed?`<p class="correctText">✅ ${esc(q.f)}</p>`:role==='player'&&answered?'<p class="notice">🔒 Answer locked in. Waiting for the rest…</p>':''}`}</div><div class="panel"><div class="statline"><h2>${done?'Final leaderboard':'Live leaderboard'}</h2><span class="muted">${done?'':data.answersCount+'/'+data.players.length+' answered'}</span></div>${scores()}${role==='host'?`<div class="actions">${done?button('Play again',"sendAction('restart')"):revealed?button(data.idx===14?'Finish game':'Next question →',"sendAction('next')"):button('Reveal answer',"sendAction('reveal')",'secondary')}</div>`:`<p class="muted">${me?'Your points: '+me.score.toLocaleString():''}</p>`}</div>`;
 tick();
}
function tick(){if(!data)return;const el=document.getElementById('timer');if(!el)return;el.textContent=data.phase==='question'?Math.max(0,Math.ceil((data.deadline-Date.now())/1000))+'s':'';if(data.phase==='question'&&Date.now()>data.deadline+500&&role==='host'){} }
function copyLink(){if(navigator.clipboard)navigator.clipboard.writeText(invite()).then(()=>alert('Invite copied')).catch(()=>prompt('Copy invite',invite()));else prompt('Copy invite',invite())}
function shareLink(){if(navigator.share)navigator.share({title:'Rail Rivalry quiz',url:invite()}).catch(()=>{});else copyLink()}
async function resume(){const t=room&&sessionStorage.getItem('rail_host_'+room);if(t&&params.get('host')==='1'){token=t;role='host'}else if(room&&sessionStorage.getItem('rail_player_'+room)){role='player'}else if(room){joinView();return}else{landing();return}app.innerHTML='<div class="panel"><h2>Reconnecting…</h2></div>';try{data=await api('state');render();startPolling()}catch{joinView()}}
resume();
setInterval(tick,250);
</script></body></html>
